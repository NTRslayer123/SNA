services:
  db:
    image: postgis/postgis:16-3.4
    container_name: nlams_postgis_db
    restart: always
    environment:
      POSTGRES_DB: nlams_db
      POSTGRES_USER: nlams_admin
      POSTGRES_PASSWORD: nlams_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nlams_admin -d nlams_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nlams_backend_api
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://nlams_admin:nlams_secure_password_2026@db:5432/nlams_db
      JWT_SECRET: super_secret_nlams_jwt_signing_key_2026_dolt_mord
      ENVIRONMENT: production
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nlams_frontend_web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
